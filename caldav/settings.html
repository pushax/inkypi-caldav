<div id="caldavSources"></div>

<div class="form-group">
    <button type="button" id="addSource" class="action-button compact">+ Add source</button>
</div>

<template id="caldavSourceTemplate">
    <fieldset class="caldav-source" style="border: 1px solid var(--border-color, #ccc); border-radius: 5px; padding: 10px; margin: 0 0 15px;">
        <legend class="form-label">
            Source <span class="source-number"></span>
            <button type="button" class="remove-source action-button compact warn" style="margin-left: 8px; padding: 2px 8px;">&times;</button>
        </legend>

        <div class="form-group">
            <label class="form-label">CalDAV URL:</label>
            <input type="text" name="sourceUrl[]" data-field="url" class="form-input"
                   placeholder="https://example.com/dav/calendars/username/" required>
        </div>

        <div class="form-group">
            <label class="form-label">Authorization:</label>
            <select name="sourceAuthType[]" data-field="authType" class="form-input">
                <option value="basic">Basic (username + token/password)</option>
                <option value="bearer">Bearer token</option>
                <option value="none">None</option>
            </select>
        </div>

        <div class="form-group source-username">
            <label class="form-label">Username:</label>
            <input type="text" name="sourceUsername[]" data-field="username" class="form-input" autocomplete="off">
        </div>

        <div class="form-group source-secret">
            <label class="form-label">Token / password:</label>
            <input type="password" name="sourceToken[]" data-field="token" class="form-input" autocomplete="new-password"
                   placeholder="leave empty to read it from .env">
        </div>

        <div class="form-group source-secret">
            <label class="form-label">.env key (used when the token field is empty):</label>
            <input type="text" name="sourceTokenEnvKey[]" data-field="tokenEnvKey" class="form-input"
                   placeholder="{{ default_env_key }}">
        </div>

        <div class="form-group">
            <label class="form-label">Verify TLS certificate:</label>
            <select name="sourceVerifyTls[]" data-field="verifyTls" class="form-input">
                <option value="true">Yes</option>
                <option value="false">No (self-signed)</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Calendars (comma separated names, empty = all):</label>
            <input type="text" name="sourceCalendars[]" data-field="calendars" class="form-input" placeholder="Inbox, Home">
        </div>
    </fieldset>
</template>

<div class="form-group">
    <label for="view" class="form-label">View:</label>
    <select id="view" name="view" class="form-input">
        <option value="agenda">Agenda (list by day)</option>
        <option value="today">Today only (single column)</option>
        <option value="month">Month grid</option>
    </select>
</div>

<div class="form-group" id="daysGroup">
    <label for="days" class="form-label">Days ahead (agenda):</label>
    <input type="number" id="days" name="days" class="form-input" min="1" max="60" value="7">
</div>

<div class="form-group">
    <label for="showEvents" class="form-label">Show events (VEVENT):</label>
    <select id="showEvents" name="showEvents" class="form-input">
        <option value="true">Yes</option>
        <option value="false">No</option>
    </select>
</div>

<div class="form-group">
    <label for="showTasks" class="form-label">Show tasks (VTODO):</label>
    <select id="showTasks" name="showTasks" class="form-input">
        <option value="true">Yes</option>
        <option value="false">No</option>
    </select>
</div>

<div class="form-group">
    <label for="showUndated" class="form-label">Show tasks without a due date (agenda):</label>
    <select id="showUndated" name="showUndated" class="form-input">
        <option value="false">No</option>
        <option value="true">Yes</option>
    </select>
</div>

<div class="form-group">
    <label for="language" class="form-label">Language:</label>
    <select id="language" name="language" class="form-input">
        {% for code, name in languages %}
        <option value="{{ code }}">{{ name }}</option>
        {% endfor %}
    </select>
</div>

<div class="form-group">
    <label for="weekStart" class="form-label">Week starts on:</label>
    <select id="weekStart" name="weekStart" class="form-input">
        <option value="monday">Monday</option>
        <option value="sunday">Sunday</option>
    </select>
</div>

<div class="form-group">
    <label for="title" class="form-label">Title (optional):</label>
    <input type="text" id="title" name="title" class="form-input" placeholder="default: weekday / month">
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const fields = ['view', 'days', 'showEvents', 'showTasks', 'showUndated',
                        'language', 'weekStart', 'title'];
        const sourceFields = ['url', 'authType', 'username', 'token', 'tokenEnvKey', 'verifyTls', 'calendars'];
        const sourceKeys = {
            url: 'sourceUrl[]', authType: 'sourceAuthType[]', username: 'sourceUsername[]',
            token: 'sourceToken[]', tokenEnvKey: 'sourceTokenEnvKey[]', verifyTls: 'sourceVerifyTls[]',
            calendars: 'sourceCalendars[]',
        };
        // Settings saved before multiple sources existed.
        const legacyKeys = {
            url: 'caldavUrl', authType: 'authType', username: 'username', token: 'token',
            tokenEnvKey: 'tokenEnvKey', verifyTls: 'verifyTls', calendars: 'calendars',
        };

        const hasSaved = typeof loadPluginSettings !== 'undefined' && loadPluginSettings;
        if (hasSaved) {
            fields.forEach((name) => {
                const el = document.getElementById(name);
                const saved = pluginSettings[name];
                if (el && saved !== undefined && saved !== null && saved !== '') {
                    el.value = saved;
                }
            });
        }

        const container = document.getElementById('caldavSources');
        const template = document.getElementById('caldavSourceTemplate');

        const syncSource = (block) => {
            const auth = block.querySelector('[data-field="authType"]').value;
            block.querySelector('.source-username').style.display = auth === 'basic' ? '' : 'none';
            block.querySelectorAll('.source-secret').forEach((el) => {
                el.style.display = auth === 'none' ? 'none' : '';
            });
        };
        const renumber = () => {
            const blocks = container.querySelectorAll('.caldav-source');
            blocks.forEach((block, i) => {
                block.querySelector('.source-number').textContent = i + 1;
                block.querySelector('.remove-source').style.display = blocks.length > 1 ? '' : 'none';
            });
        };
        const addSource = (values) => {
            const block = template.content.firstElementChild.cloneNode(true);
            sourceFields.forEach((field) => {
                const v = values && values[field];
                if (v !== undefined && v !== null && v !== '') {
                    block.querySelector(`[data-field="${field}"]`).value = v;
                }
            });
            block.querySelector('[data-field="authType"]').addEventListener('change', () => syncSource(block));
            block.querySelector('.remove-source').addEventListener('click', () => {
                block.remove();
                renumber();
            });
            container.appendChild(block);
            syncSource(block);
            renumber();
        };

        const saved = [];
        if (hasSaved && Array.isArray(pluginSettings[sourceKeys.url])) {
            pluginSettings[sourceKeys.url].forEach((_, i) => {
                const values = {};
                sourceFields.forEach((field) => {
                    const list = pluginSettings[sourceKeys[field]];
                    values[field] = Array.isArray(list) ? list[i] : undefined;
                });
                saved.push(values);
            });
        } else if (hasSaved && pluginSettings[legacyKeys.url]) {
            const values = {};
            sourceFields.forEach((field) => { values[field] = pluginSettings[legacyKeys[field]]; });
            saved.push(values);
        }
        if (saved.length) {
            saved.forEach(addSource);
        } else {
            addSource();
        }
        document.getElementById('addSource').addEventListener('click', () => addSource());

        const view = document.getElementById('view');
        const sync = () => {
            document.getElementById('daysGroup').style.display =
                view.value === 'agenda' ? '' : 'none';
        };
        view.addEventListener('change', sync);
        sync();
    });
</script>
